[project]
name = "india"
version = "0.1.0"
description = "Alpha Strategy For Indian Market"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "japanize-matplotlib==1.1.3",
    "matplotlib==3.10.3",
    "notebook==7.4.4",
    "numpy==1.26.3",
    "pandas==2.1.4",
    "pyyaml==6.0.1",
    "scipy==1.14.1",
    "tqdm==4.65.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
